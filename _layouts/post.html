---
layout: default
---
<article class="post">
  <p class="meta">{{ page.date | date: '%B %-d, %Y' }}{% if page.tags.size > 0 %} · {{ page.tags | join: ', ' }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  <div class="content">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/posts/' | relative_url }}">← All posts</a></p>
</article>
